<!doctype html>
<html><head><meta charset="utf-8"><title>THE SLOT — Bookends</title>
<style>

@font-face{font-family:Sans;src:url(fonts/sans700.woff2) format('woff2');font-weight:700}

<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// THE SLOT — "Bookends": UMass Boston 8, Plymouth State 5 (6 Feb 2026), in the Sports Telestrator style.
// render(t) is deterministic; footage frames (assets/<clip>/NNNN.jpg, 60 fps, 1920×1080) load on demand.
// Tracking points are in SOURCE pixels (1280×720) at SOURCE seconds; P() scales them to the 1920 frame.
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1920, H = 1080;
const Q = new URLSearchParams(location.search), DBG = Q.get('dbg') === '1', NOSUB = Q.get('nosub') === '1';
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - clamp(k), 3);
const eio = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const back = (k, s = 1.7) => { k = clamp(k) - 1; return k * k * ((s + 1) * k + s) + 1; };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

const COL = { ink: '#FFD400', def: '#3FD8FF', space: '#FF3B30', chalk: '#F4F1E8', board: '#0C1411', card: 'rgba(8,12,14,0.9)', solid: '#080C0E' };
const F_S = 'Sans', F_C = 'Cond', F_M = 'Mono';

// —— Footage ——
const cache = new Map();
function img(src) {
  if (!cache.has(src)) {
    if (cache.size > 120) { const k = cache.keys().next().value; cache.delete(k); }
    cache.set(src, new Promise(res => { const im = new Image(); im.onload = () => im.decode().then(() => res(im), () => res(im)); im.onerror = () => res(null); im.src = src; }));
  }
  return cache.get(src);
}
let TL, CLIPS = [];
function clipOf(src) { for (const [id, [a, b]] of CLIPS) if (src >= a - .02 && src <= b + .02) return [id, a, b]; return null; }
function fsrc(src) {   // source second → frame file (nearest 60 fps frame of the clip that holds it)
  const c = clipOf(src); if (!c) return null; const [id, a, b] = c; const n = clamp(Math.round((src - a) * 60) + 1, 1, Math.floor((b - a) * 60));
  return `assets/${id}/${String(n).padStart(4, '0')}.jpg`;
}
async function drawSrc(src, o = {}) {
  // slow motion: neighbour frames cross-blended (no stutter)
  const f = src * 60, a = Math.floor(f + 1e-6), u = f - a;
  const A = await img(fsrc(a / 60)), B = u > .02 ? await img(fsrc((a + 1) / 60)) : null;
  X.save();
  if (o.zoom && o.zoom !== 1) { const z = o.zoom, cx = o.cx ?? W / 2, cy = o.cy ?? H / 2; X.translate(cx, cy); X.scale(z, z); X.translate(-cx, -cy); }
  if (o.jx) X.translate(o.jx, 0);
  if (A) X.drawImage(A, 0, 0, W, H); else { X.fillStyle = '#223'; X.fillRect(0, 0, W, H); }
  if (B) { X.globalAlpha = u; X.drawImage(B, 0, 0, W, H); X.globalAlpha = 1; }
  X.restore();
}

// —— Tracking (source px at source seconds) ——
const P = (x, y) => [x * 1.5, y * 1.5];
const TRK = {
  d25: [[276.6, 290, 535], [277.2, 190, 530], [277.8, 280, 550], [278.4, 330, 640], [279.0, 270, 690]],
  d17: [[276.6, 745, 450], [277.2, 696, 460], [277.8, 670, 480], [278.4, 636, 490], [279.0, 626, 500], [279.6, 593, 480], [280.2, 601, 428], [280.7, 610, 410], [281.2, 618, 333]],
  d16: [[279.6, 907, 337], [279.9, 898, 336], [280.3, 900, 335], [280.7, 890, 335], [281.9, 905, 300]],   // #16 Mortson, far circle (one-timer on one knee at 279.9)
  d3:  [[276.6, 995, 670], [277.2, 980, 660], [277.8, 960, 670], [278.4, 940, 660], [279.0, 1000, 600], [279.6, 967, 527], [280.7, 1110, 470]],
  dnet: [[276.6, 440, 330], [277.2, 450, 310], [277.8, 440, 310], [278.4, 430, 310], [279.0, 430, 320], [279.6, 400, 350], [280.7, 423, 350], [281.0, 422, 352], [281.4, 400, 352], [282.7, 330, 352]]
};
function at(tr, s) {
  const k = TRK[tr]; if (s <= k[0][0]) return P(k[0][1], k[0][2]);
  for (let i = 1; i < k.length; i++) if (s <= k[i][0]) { const a = k[i - 1], b = k[i], u = (s - a[0]) / (b[0] - a[0]); return P(lerp(a[1], b[1], u), lerp(a[2], b[2], u)); }
  const l = k[k.length - 1]; return P(l[1], l[2]);
}

// —— Timeline ——
function S(id) { return TL.seg.find(s => s.id === id); }
function segAt(t) { for (const s of TL.seg) if (t >= s.t0 && t < s.t1) return s; return TL.seg[TL.seg.length - 1]; }
function srcAt(s, t) {
  const k = seg(t, s.t0, s.t1);
  if (s.kind === 'rew') return lerp(s.s0, s.s1, eio(k));
  return lerp(s.s0, s.s1, k);
}

// —— Drawing helpers ——
function wob(pts, amp, seed) { return pts.map((p, i) => { if (i === 0 || i === pts.length - 1) return p; const n = (hash(seed + i * 3.1) - .5) * 2 * amp; return [p[0] + n, p[1] + n * .6]; }); }
function bez(a, c, b, n = 28) { const o = []; for (let i = 0; i <= n; i++) { const u = i / n; o.push([(1-u)*(1-u)*a[0] + 2*(1-u)*u*c[0] + u*u*b[0], (1-u)*(1-u)*a[1] + 2*(1-u)*u*c[1] + u*u*b[1]]); } return o; }
function plen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); return L; }
function partial(pts, k) {
  const L = plen(pts) * clamp(k); const o = [pts[0]]; let acc = 0;
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); if (acc + d >= L) { const u = (L - acc) / (d || 1); o.push([lerp(pts[i-1][0], pts[i][0], u), lerp(pts[i-1][1], pts[i][1], u)]); return o; } acc += d; o.push(pts[i]); }
  return o;
}
function path(pts) { X.beginPath(); X.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) X.lineTo(pts[i][0], pts[i][1]); }
function marker(pts, k, col, w = 9, o = {}) {
  if (k <= 0) return;
  const p = partial(pts, k); if (p.length < 2) return;
  X.save(); X.lineCap = 'round'; X.lineJoin = 'round';
  if (o.dash) X.setLineDash(o.dash);
  path(p); X.strokeStyle = 'rgba(0,0,0,0.55)'; X.lineWidth = w + 6; X.stroke();
  X.shadowColor = col; X.shadowBlur = 18; path(p); X.strokeStyle = col; X.lineWidth = w; X.stroke();
  X.shadowBlur = 0; path(p); X.strokeStyle = 'rgba(255,255,255,0.55)'; X.lineWidth = Math.max(2, w * .28); X.stroke();
  X.setLineDash([]);
  if (o.arrow && k > .9) {
    const a = p[p.length - 1], b = p[Math.max(0, p.length - 4)]; const ang = Math.atan2(a[1] - b[1], a[0] - b[0]); const s = w * 3.2 * eo(seg(k, .9, 1));
    X.translate(a[0], a[1]); X.rotate(ang);
    X.beginPath(); X.moveTo(s * .4, 0); X.lineTo(-s, -s * .62); X.lineTo(-s * .62, 0); X.lineTo(-s, s * .62); X.closePath();
    X.lineWidth = 6; X.strokeStyle = 'rgba(0,0,0,0.55)'; X.stroke();
    X.shadowColor = col; X.shadowBlur = 16; X.fillStyle = col; X.fill();
  }
  X.restore();
}
function ring(x, y, r, col, k = 1, t = 0, o = {}) {
  if (k <= 0) return;
  const ry = r * .36;
  X.save();
  if (o.beam) {
    const g = X.createLinearGradient(x, y - r * 3.2, x, y); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, col + '55');
    X.globalAlpha = k * .9; X.fillStyle = g;
    X.beginPath(); X.moveTo(x - r * .55, y - r * 3.2); X.lineTo(x + r * .55, y - r * 3.2); X.lineTo(x + r, y); X.lineTo(x - r, y); X.closePath(); X.fill();
    X.globalAlpha = 1;
  }
  X.beginPath(); X.ellipse(x, y, r * eo(k), ry * eo(k), 0, 0, Math.PI * 2); X.fillStyle = col + '30'; X.fill();
  X.lineWidth = 11; X.strokeStyle = 'rgba(0,0,0,0.5)';
  X.beginPath(); X.ellipse(x, y, r, ry, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); X.stroke();
  X.shadowColor = col; X.shadowBlur = 16; X.lineWidth = 6; X.strokeStyle = col; X.stroke(); X.shadowBlur = 0;
  X.setLineDash([16, 14]); X.lineDashOffset = -t * 60; X.lineWidth = 3; X.globalAlpha = .85 * k;
  X.beginPath(); X.ellipse(x, y, r * 1.32, ry * 1.32, 0, 0, Math.PI * 2); X.stroke();
  X.restore();
}
function spacePatch(cx, cy, rx, ry, rot, k) {
  if (k <= 0) return; const sk = eo(k);
  X.save(); X.globalAlpha = .36 * sk; X.fillStyle = COL.space; X.beginPath(); X.ellipse(cx, cy, rx * sk, ry * sk, rot, 0, Math.PI * 2); X.fill(); X.restore();
  X.save(); X.globalAlpha = sk; X.setLineDash([14, 10]); X.strokeStyle = COL.space; X.lineWidth = 4; X.beginPath(); X.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); X.stroke(); X.restore();
}
// Label: dark card, coloured left bar, big English line + small spaced tag line in the role colour
function tag(x, y, big, small, col, k = 1, o = {}) {
  if (k <= 0) return;
  const bs = o.size || 40, ss = o.esize || 21;
  X.save();
  X.font = `900 ${bs}px ${F_S}`; const wb = X.measureText(big).width;
  X.font = `600 ${ss}px ${F_C}`; X.letterSpacing = '2px'; const ws = small ? X.measureText(small).width : 0; X.letterSpacing = '0px';
  const w = Math.max(wb, ws) + 46, h = bs + (small ? ss + 30 : 22);
  const ax = o.right ? x - w : x, kk = eo(k);
  X.beginPath(); X.rect(ax, y, w * kk, h); X.clip();
  X.fillStyle = COL.card; X.fillRect(ax, y, w, h);
  X.fillStyle = col; X.fillRect(ax, y, 8, h);
  X.fillStyle = '#fff'; X.font = `900 ${bs}px ${F_S}`; X.textBaseline = 'top'; X.fillText(big, ax + 26, y + 9);
  if (small) { X.fillStyle = col; X.font = `600 ${ss}px ${F_C}`; X.letterSpacing = '2px'; X.fillText(small, ax + 27, y + 16 + bs); }
  X.restore();
}
function cover(im, sc = 1, fx = .5, fy = .5) { if (!im) return; const s = Math.max(W / im.width, H / im.height) * sc, w = im.width * s, h = im.height * s; X.drawImage(im, (W - w) * fx, (H - h) * fy, w, h); }
function grade(o = {}) {
  if (o.freeze) { X.save(); X.globalCompositeOperation = 'saturation'; X.fillStyle = `rgba(128,128,128,${0.42 * o.freeze})`; X.fillRect(0, 0, W, H); X.restore();
    X.fillStyle = `rgba(10,22,30,${0.16 * o.freeze})`; X.fillRect(0, 0, W, H); }
  const g = X.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${0.34 + 0.2 * (o.freeze || 0)})`); X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function spot(cx, cy, rx, ry, k) {
  if (k <= 0) return;
  X.save(); X.fillStyle = `rgba(0,0,0,${0.42 * k})`; X.beginPath(); X.rect(0, 0, W, H); X.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2, true); X.fill('evenodd'); X.restore();
}
function flash(t, t0, d = .12, a = .55) { const k = seg(t, t0, t0 + d); if (k > 0 && k < 1) { X.fillStyle = `rgba(255,255,255,${a * (1 - k)})`; X.fillRect(0, 0, W, H); } }
function grid(alpha = 1) {
  X.save(); X.globalAlpha = alpha; X.strokeStyle = 'rgba(244,241,232,0.045)'; X.lineWidth = 1;
  for (let x = 30; x < W; x += 60) { X.beginPath(); X.moveTo(x + .5, 0); X.lineTo(x + .5, H); X.stroke(); }
  for (let y = 30; y < H; y += 60) { X.beginPath(); X.moveTo(0, y + .5); X.lineTo(W, y + .5); X.stroke(); }
  X.restore();
}
function boardBg(alpha = 1) {
  X.fillStyle = COL.board; X.fillRect(0, 0, W, H); grid(alpha);
  const vg = X.createRadialGradient(760, 520, 200, 760, 520, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); X.fillStyle = vg; X.fillRect(0, 0, W, H);
}
function revealText(str, x, y, k) {
  if (k <= 0) return; const w = X.measureText(str).width; const al = X.textAlign;
  const x0 = al === 'right' ? x - w : al === 'center' ? x - w / 2 : x;
  X.save(); X.beginPath(); X.rect(x0 - 4, y - 200, (w + 12) * clamp(k), 260); X.clip(); X.fillText(str, x, y); X.restore();
}

// —— Packaging: the top strip sits exactly over the broadcaster's score graphic (source x 188–1093, y 56–128; ×1.5, with room for the 1.047 punch) ——
const STRIP = { x: 240, y: 56, w: 1440, h1: 80, h2: 64 };
function scoreAt(t) {
  let st = { umb: 0, psu: 0, lab: '1ST', g: 0 };
  for (const G of TL.goals) { if (t < G.from) break; const done = t >= G.t; st = { umb: done ? G.umb : G.umb - 1, psu: G.psu, lab: done ? G.lab : periodOf(t), g: seg(t, G.t, G.t + .5), flipping: t >= G.t && t < G.t + .5 }; }
  return st;
}
function periodOf(t) { const s = segAt(t); const i = TL.seg.indexOf(s); return i <= TL.seg.indexOf(S('g4')) ? '1ST' : '2ND'; }
function clockText(s, src) {
  if (!s || !s.clock) return null;
  if (s.clock === 'g1') { const el = Math.max(0, Math.min(src, 10.5) - 0.5), r = Math.ceil(1200 - el - 1e-6); return `${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}`; }
  if (s.clock === 'g13') { const v = arena(src); return `0:${v.toFixed(1).padStart(4, '0')}`; }
  return null;
}
function arena(src) { return Math.max(7.7, 13.0 - (src - 276.2)); }   // the arena clock seen in frame: 13.0 at 276.2 s, stops at 07.7 when the goal is given
function strip(t, mode, s, src, k = 1) {
  if (k <= 0) return;
  const { x, y, w, h1, h2 } = STRIP, st = scoreAt(t);
  X.save(); X.globalAlpha = clamp(k * 2);
  X.fillStyle = COL.solid; X.fillRect(x, y, w, h1 + h2);
  // show block
  X.fillStyle = COL.ink; X.fillRect(x, y, 250, h1);
  X.fillStyle = '#0B0F14'; X.font = `800 italic 44px ${F_C}`; X.textBaseline = 'middle'; X.letterSpacing = '2px'; X.fillText('THE SLOT', x + 22, y + h1 / 2 + 2);
  // teams + score
  const cy = y + h1 / 2 + 2;
  X.letterSpacing = '2px'; X.font = `800 italic 38px ${F_C}`; X.fillStyle = '#fff';
  X.fillStyle = COL.def; X.fillRect(x + 280, y + 16, 6, h1 - 32);
  X.fillStyle = '#fff'; X.fillText('PLYMOUTH ST', x + 300, cy);
  const flip = st.flipping ? st.g : 1;
  X.textAlign = 'center'; X.font = `800 italic 52px ${F_C}`;
  X.fillText(String(st.psu), x + 600, cy + 1); X.fillStyle = 'rgba(255,255,255,0.45)'; X.fillText('–', x + 648, cy + 1);
  X.save(); X.beginPath(); X.rect(x + 668, y + 6, 64, h1 - 12); X.clip();
  const shown = st.flipping && flip < .5 ? st.umb - 1 : st.umb, dy = st.flipping ? Math.sin(flip * Math.PI) * -8 : 0;
  X.fillStyle = COL.ink; X.fillText(String(Math.max(0, shown)), x + 700, cy + 1 + dy); X.restore();
  X.textAlign = 'left'; X.fillStyle = COL.ink; X.fillRect(x + 752, y + 16, 6, h1 - 32);
  X.fillStyle = '#fff'; X.font = `800 italic 38px ${F_C}`; X.fillText('UMASS BOSTON', x + 772, cy);
  X.fillStyle = 'rgba(255,255,255,0.14)'; X.fillRect(x + 1030, y + 14, 2, h1 - 28);
  const ck = clockText(s, src);
  X.font = ck ? `500 34px ${F_M}` : `800 italic 36px ${F_C}`; X.letterSpacing = ck ? '0px' : '2px';
  X.fillStyle = ck ? '#fff' : COL.ink; X.fillText(ck ? ck + '  ' + periodOf(t) : st.lab, x + 1056, cy);
  if (st.flipping) { X.fillStyle = `rgba(255,212,0,${0.55 * (1 - st.g)})`; X.fillRect(x, y, w, h1); }
  // row 2: mode + situation
  const M = { live: ['LIVE', '#FF3B30'], ana: ['ANALYSIS', COL.ink], rep: ['REPLAY', COL.def] }[mode] || ['', '#fff'];
  X.fillStyle = 'rgba(255,255,255,0.08)'; X.fillRect(x, y + h1, w, 1);
  if (mode === 'live') { X.beginPath(); X.arc(x + 34, y + h1 + h2 / 2, 8, 0, 7); X.fillStyle = '#FF3B30'; X.fill(); }
  X.fillStyle = M[1]; X.font = `600 26px ${F_C}`; X.letterSpacing = '5px'; X.fillText(M[0], x + (mode === 'live' ? 54 : 24), y + h1 + h2 / 2 + 1);
  if (s && s.pp) { X.fillStyle = COL.ink; X.fillRect(x + 560, y + h1 + 14, 6, h2 - 28); X.fillStyle = '#fff'; X.font = `600 26px ${F_C}`; X.fillText('UMASS BOSTON POWER PLAY', x + 580, y + h1 + h2 / 2 + 1); }
  X.fillStyle = 'rgba(255,255,255,0.55)'; X.font = `600 22px ${F_C}`; X.letterSpacing = '3px'; X.textAlign = 'right';
  X.fillText('NCAA D-III · 6 FEB 2026', x + w - 24, y + h1 + h2 / 2 + 1); X.textAlign = 'left';
  X.restore();
}
function clockTag(src, mode) {
  // source timecode of the highlight video, right of the strip (the times and frames everything is counted from)
  const x = 1696, y = 56;
  X.save(); X.fillStyle = 'rgba(8,12,14,0.88)'; X.fillRect(x, y, 186, 144);
  X.fillStyle = mode === 'freeze' ? COL.ink : '#fff'; X.font = `500 26px ${F_M}`; X.textBaseline = 'middle';
  const icon = mode === 'freeze' ? '❚❚' : mode === 'rew' ? '◀◀' : mode === 'slow' ? '▶ ½' : '▶';
  X.fillText(icon, x + 18, y + 34);
  X.fillText(src.toFixed(2) + 's', x + 18, y + 76);
  X.fillStyle = 'rgba(255,255,255,0.55)'; X.font = `500 20px ${F_M}`; X.fillText('F' + Math.round(src * 60), x + 18, y + 114);
  X.restore();
}
// Subtitles: one English line (the film is in one language: it takes the upper line's place and size), never wrapped
const SUB = { cx: 960, size: 38, maxW: 1500 };
function cueSpan(i) { const v = TL.vo[i], d = (TL.vdur && TL.vdur[v.id]) || 2.5, nx = TL.vo[i + 1]; return [v.t, Math.min(v.t + d + .45, nx ? nx.t - .08 : 1e9)]; }
function subtitle(t) {
  if (NOSUB) return;
  TL.vo.forEach((v, i) => {
    const [t0, t1] = cueSpan(i); const a = seg(t, t0, t0 + .12) * (1 - seg(t, t1 - .18, t1)); if (a <= 0) return;
    X.save(); X.globalAlpha = a; X.textAlign = 'center'; X.textBaseline = 'middle';
    X.font = `500 ${SUB.size}px ${F_S}`; const w = X.measureText(v.text).width + 56;
    if (w > SUB.maxW) console.warn('subtitle too wide:', v.id, Math.round(w));
    const y0 = 956, h = 72;
    X.fillStyle = 'rgba(0,0,0,0.64)'; X.fillRect(SUB.cx - w / 2, y0, w, h);
    X.fillStyle = COL.ink; X.fillRect(SUB.cx - w / 2, y0, 4, h);
    X.fillStyle = '#fff'; X.fillText(v.text, SUB.cx, y0 + h / 2 + 1);
    X.restore();
  });
}
function wipe(t, t0, d = .34) {
  const k = seg(t, t0 - d / 2, t0 + d / 2); if (k <= 0 || k >= 1) return;
  const x = lerp(-900, W + 900, eio(k));
  X.save(); X.translate(x, 0); X.transform(1, 0, -0.38, 1, 0, 0);
  X.fillStyle = COL.ink; X.fillRect(-260, 0, 520, H); X.fillStyle = '#0B0F14'; X.fillRect(-300, 0, 40, H); X.fillRect(260, 0, 18, H);
  X.restore();
