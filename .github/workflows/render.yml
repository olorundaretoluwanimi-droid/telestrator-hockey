# Render THE SLOT — "Bookends" on GitHub Actions: the frame range is split across parallel CPU jobs (Canvas 2D page),
# each job preps only the footage frames its range needs; one job joins the parts, adds the mastered soundtrack and film grain.
# gh workflow run render.yml   (the finished film is the run's artifact "telestrator-hockey")
name: Render film

on:
  workflow_dispatch:
    inputs:
      start: { description: 'Start second', default: '0' }
      end: { description: 'End second (129.8 = whole film)', default: '129.8' }
      parts: { description: 'Parallel render jobs', default: '16' }
      fps: { description: 'Frames per second', default: '30' }
      crf: { description: 'x264 quality of the finished film', default: '20' }

env:
  LIB: ${{ github.workspace }}/lemo-opuscar
  LIB_REF: 439b98a

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          a, b, n, fps = float('${{ inputs.start }}'), float('${{ inputs.end }}'), int('${{ inputs.parts }}'), float('${{ inputs.fps }}')
          f0, f1 = round(a * fps), round(b * fps); n = max(1, min(n, f1 - f0))
          cuts = [f0 + (f1 - f0) * i // n for i in range(n + 1)]
          parts = [{'i': f'{i:02d}', 'a': cuts[i] / fps, 'b': cuts[i + 1] / fps} for i in range(n) if cuts[i + 1] > cuts[i]]
          print('matrix=' + json.dumps({'include': parts}))
          PY

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { path: film }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Library + headless browser + ffmpeg
        run: |
          git clone https://github.com/lemomo-ai/lemo-opuscar "$LIB"
          git -C "$LIB" checkout "$LIB_REF" || echo "pinned commit not found, using the default branch"
          cd "$LIB" && (npm ci --no-audit --no-fund || npm install --no-audit --no-fund)
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Footage frames for ${{ matrix.a }}s – ${{ matrix.b }}s
        run: python3 film/tools/prep.py ${{ matrix.a }} ${{ matrix.b }}
      - name: Render ${{ matrix.a }}s – ${{ matrix.b }}s
        run: |
          cd "$LIB"
          node "$GITHUB_WORKSPACE/film/tools/render_range.mjs" ${{ matrix.a }} ${{ matrix.b }} --fps ${{ inputs.fps }} --workers "$(nproc)" --out "$GITHUB_WORKSPACE/part_${{ matrix.i }}.mp4" | tee render.log
          test -s "$GITHUB_WORKSPACE/part_${{ matrix.i }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.i }}
          path: part_${{ matrix.i }}.mp4
          retention-days: 3

  finish:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: film }
      - uses: actions/download-artifact@v4
        with: { pattern: part-*, merge-multiple: true, path: parts }
      - name: Join parts, add soundtrack and grain, encode
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ls parts/*.mp4 | sort | sed "s#^#file '$PWD/#; s#\$#'#" > list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy -an picture.mp4
          got=$(ffprobe -v error -count_packets -select_streams v -show_entries stream=nb_read_packets -of default=nw=1:nk=1 picture.mp4 | tr -dc 0-9)
          want=$(python3 -c "print(round(${{ inputs.end }}*${{ inputs.fps }}) - round(${{ inputs.start }}*${{ inputs.fps }}))")
          echo "joined $(ls parts/*.mp4 | wc -l) parts: $got frames (expected $want)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$got" = "$want" ] || { echo "::error::frame count mismatch, a part is missing"; exit 1; }
          cat film/audio/master/soundtrack.m4a.part* > soundtrack.m4a
          ffmpeg -v error -stats -y -i picture.mp4 -i soundtrack.m4a -map 0:v -map 1:a -vf "noise=alls=2:allf=t" \
            -c:v libx264 -preset slow -crf ${{ inputs.crf }} -pix_fmt yuv420p -profile:v high -level 4.1 \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 -c:a copy -movflags +faststart -shortest telestrator-hockey.mp4
          ls -l telestrator-hockey.mp4 | tee -a "$GITHUB_STEP_SUMMARY"
          ffmpeg -v error -y -ss 92.3 -i telestrator-hockey.mp4 -frames:v 1 -q:v 2 poster.jpg
          ffmpeg -hide_banner -i telestrator-hockey.mp4 -af ebur128=peak=true -f null - 2>&1 | grep -E "I:|Peak:" | tail -2 | tee -a "$GITHUB_STEP_SUMMARY"
          ffmpeg -hide_banner -i telestrator-hockey.mp4 -vf blackdetect=d=0.15:pix_th=0.05 -an -f null - 2>&1 | grep blackdetect | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: telestrator-hockey
          path: |
            telestrator-hockey.mp4
            poster.jpg
          retention-days: 14
